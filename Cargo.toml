[package]
name = "notionpad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NotionPad: editor de textos multiplataforma em Rust"

[lib]
name = "notionpad_core"
path = "src/lib.rs"

[dependencies]
ropey = "1.6.1"
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
rfd = "=0.17.2"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
